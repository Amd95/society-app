name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :shared:model:testDebugUnitTest :shared:domain:testDebugUnitTest --console=plain
      - name: Assemble debug
        run: ./gradlew :androidApp:assembleDebug --console=plain
